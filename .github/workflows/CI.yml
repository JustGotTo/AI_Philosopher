name: CI Pipeline

on:
  push:
     branches: [main]
  pull_request:
     branches: [main]
     
jobs:
  test:
    name: Run Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Github Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      -run: npm install
      -run: npm test

        

      
